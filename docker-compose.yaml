services:
  legend-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: legend-ai:latest
    container_name: legend-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  logs:
    driver: local
